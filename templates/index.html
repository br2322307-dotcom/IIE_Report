<style>/* Reset default styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background-color: #ffffff;
}

/* Hero Section Container with the custom wavy background */
.hero-section {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 40px 20px;
  background-color: #ffffff;
  /* Recreating the organic wave pattern using an inline SVG background */
  background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 1440 800' preserveAspectRatio='none'%3E%3Cpath fill='%23ececec' fill-opacity='1' d='M0,224L120,202.7C240,181,480,139,720,218.7C960,299,1200,501,1320,602.7L1440,704L1440,800L1320,800C1200,800,960,800,720,800C480,800,240,800,120,800L0,800Z'%3E%3C/path%3E%3Cpath fill='%23ececec' fill-opacity='1' d='M0,160L240,120C480,120,960,320,1200,380L1440,420L1440,0L1200,0C960,0,480,0,240,0L0,0Z'%3E%3C/path%3E%3C/svg%3E");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* Inner alignment container */
.container {
  text-align: center;
  max-width: 680px;
  width: 100%;
}

/* Heading style matching the bold serif look */
.title {
  font-family: 'Playfair Display', serif;
  font-size: 3.5rem;
  color: #111111;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 12px;
}

/* The thin accent underline */
.divider {
  border: none;
  height: 1px;
  background-color: #b0b0b0;
  width: 55%;
  margin: 0 auto 24px auto;
}

/* Description paragraph styling */
.description {
  font-size: 1.05rem;
  color: #444444;
  line-height: 1.65;
  margin-bottom: 35px;
  font-weight: 400;
}

/* Button Group Alignment */
.button-group {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

/* Base button properties */
.btn {
  display: inline-block;
  text-decoration: none;
  font-size: 0.95rem;
  font-weight: 500;
  padding: 14px 36px;
  border-radius: 50px;
  transition: all 0.3s ease;
  min-width: 150px;
}

/* Outline style button ("Book a Call") */
.btn-outline {
  color: #111111;
  border: 1px solid #7a7e9d;
  background-color: transparent;
}

.btn-outline:hover {
  background-color: #f5f5f5;
  border-color: #111111;
}

/* Solid blue style button ("Our Works") */
.btn-solid {
  color: #ffffff;
  background-color: #3142bd;
  border: 1px solid #3142bd;
}

.btn-solid:hover {
  background-color: #2432a3;
  border-color: #2432a3;
}

/* Mobile Responsive Tweaks */
@media (max-width: 600px) {
  .title {
    font-size: 2.5rem;
  }
  
  .description {
    font-size: 0.95rem;
  }
  
  .button-group {
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  
  .btn {
    width: 100%;
    max-width: 260px;
  }
}
</style>
